[project]
name = "pythonscripts"
version = "0.1.0"
description = "Repository for Python Scripts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
# Manage Python version via .python-version
managed = true

[tool.ruff]
# Match Black line length and target modern Python
line-length = 88
indent-width = 4
target-version = "py313"
# Exclude common virtual env and cache dirs
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Default + pyupgrade - keep learning examples workable
select = ["E", "F"]
extend-select = ["UP"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[tool.ruff.lint.per-file-ignores]
"learning/**/*.py" = ["D", "S101", "T201", "E501"]
"scripts/**/*.py" = ["S101", "T201", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["scripts", "learning"]
exclude = [".venv", ".git", ".ruff_cache", "__pycache__", "build", "dist"]
respect-ignore-files = true

[tool.ty.rules]
# Start permissive; enable as strictness increases
# See https://docs.astral.sh/ty/rules/ for full list
unresolved-import = "error"
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

[[tool.ty.overrides]]
include = ["learning/**"]
rules = { possibly-unresolved-reference = "warn", unresolved-import = "warn", unused-ignore-comment = "ignore" }
